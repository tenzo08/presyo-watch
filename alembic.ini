# Alembic configuration.
#
# The database URL is deliberately absent: it comes from DATABASE_URL at runtime, read in
# migrations/env.py. No connection string belongs in a checked-in file (CLAUDE.md rule 6).

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# Migration filenames are prefixed with a UTC timestamp so that ordering on disk matches
# ordering in history, which matters once more than one branch adds migrations.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC

[post_write_hooks]
# Generated migrations are code and are held to the same standard as hand-written code.
hooks = ruff_format,ruff_check
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_check.type = exec
ruff_check.executable = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
