# Enable with: uv run pre-commit install
#
# The mypy and pytest hooks run through `uv run` so they use the project's locked
# environment rather than a pre-commit-managed one — the type check is only meaningful
# against the real dependency set.

default_language_version:
  python: python3.12

# Fixtures are byte-exact captures of what a source actually served. Whitespace and
# line-ending "fixes" would corrupt them and invalidate their SHA-256 hashes.
exclude: ^tests/fixtures/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        # Fixture PDFs from the DA sources are a few hundred KB.
        args: [--maxkb=2048]
      - id: detect-private-key
      - id: check-case-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

      # CLAUDE.md § Git: run the full test suite before any commit touching src/.
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false
